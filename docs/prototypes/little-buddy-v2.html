<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --ground: #F3F6F7;
    --surface: #FFFFFF;
    --surface-2: #E8EEF0;
    --ink: #10212B;
    --muted: #56666F;
    --line: #D5DEE2;
    --ocean: #10212B;
    --ocean-2: #183342;
    --on-ocean: #EAF2F4;
    --on-ocean-muted: #A9BDC5;
    --apricot: #FF9F4A;
    --apricot-deep: #D96F14;
    --apricot-ink: #2B1502;
    --apricot-soft: #FFEBD8;
    --mint: #4FBF9F;
    --mint-soft: #DDF3EC;
    --mint-ink: #0E5A48;
    --sky: #79B4EE;
    --chart: #2E9E80;
    --warn: #8F5A0F;
    --warn-soft: #FBEBD0;
    --bad: #B93F35;
    --bad-soft: #F8E1DE;
    --screen: #0B1C24;
    --glow: #7CF0CD;
    --glow-dim: #5B7580;
    --shadow-sm: 0 1px 2px rgba(16, 33, 43, 0.06), 0 4px 14px rgba(16, 33, 43, 0.05);
    --shadow-lg: 0 24px 60px -18px rgba(16, 33, 43, 0.35);
    --display: "Lexend", "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
    --body: "Be Vietnam Pro", "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0B161D;
      --surface: #13212A;
      --surface-2: #1A2C37;
      --ink: #E8EFF1;
      --muted: #9DB0B8;
      --line: #24394A;
      --ocean: #0E2330;
      --ocean-2: #163647;
      --apricot: #FFAE66;
      --apricot-deep: #E58A38;
      --apricot-soft: #3B2614;
      --mint: #5CCBAA;
      --mint-soft: #173A33;
      --mint-ink: #9FE5D0;
      --chart: #38A487;
      --warn: #E3A548;
      --warn-soft: #3A2A12;
      --bad: #E47A70;
      --bad-soft: #3D211E;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, 0.7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0B161D;
    --surface: #13212A;
    --surface-2: #1A2C37;
    --ink: #E8EFF1;
    --muted: #9DB0B8;
    --line: #24394A;
    --ocean: #0E2330;
    --ocean-2: #163647;
    --apricot: #FFAE66;
    --apricot-deep: #E58A38;
    --apricot-soft: #3B2614;
    --mint: #5CCBAA;
    --mint-soft: #173A33;
    --mint-ink: #9FE5D0;
    --chart: #38A487;
    --warn: #E3A548;
    --warn-soft: #3A2A12;
    --bad: #E47A70;
    --bad-soft: #3D211E;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  p { margin: 0; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  :focus-visible { outline: 2.5px solid var(--sky); outline-offset: 3px; border-radius: 10px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }
  .eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1.5px solid transparent; border-radius: 999px; padding: 11px 20px;
    font-weight: 600; font-size: 15px; line-height: 1.2; text-decoration: none; white-space: nowrap;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn.apricot { background: var(--apricot); color: var(--apricot-ink); }
  .btn.apricot:hover { background: var(--apricot-deep); color: #FFF; }
  .btn.dark { background: var(--ink); color: var(--ground); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.ghost-light { background: transparent; border-color: rgba(234, 242, 244, 0.28); color: var(--on-ocean); }
  .btn.ghost-light:hover { border-color: var(--on-ocean); }
  .btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
  .btn.danger-solid { background: var(--bad); color: #FFF; }
  .btn.sm { padding: 7px 14px; font-size: 13.5px; }
  .btn.lg { padding: 15px 26px; font-size: 16px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
  .link { background: none; border: 0; padding: 0; color: var(--mint-ink); font-weight: 600; font-size: 14px; text-decoration: none; }

  .lang { display: inline-flex; border-radius: 999px; padding: 3px; background: var(--surface-2); }
  .lang button { border: 0; background: none; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .on-ocean .lang { background: rgba(234, 242, 244, 0.08); }
  .on-ocean .lang button { color: var(--on-ocean-muted); }
  .on-ocean .lang button[aria-pressed="true"] { background: var(--on-ocean); color: #10212B; }

  /* ---------- Marketing ---------- */
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    background: var(--ocean); color: var(--on-ocean);
    border-bottom: 1px solid rgba(234, 242, 244, 0.07);
  }
  .nav-inner { display: flex; align-items: center; gap: 22px; height: 66px; }
  .wordmark { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; }
  .wordmark .dotface { width: 34px; height: 26px; border-radius: 9px; background: var(--screen); color: var(--glow); display: grid; place-items: center; }
  .wordmark .dotface svg { width: 26px; }
  .nav-links { display: flex; gap: 22px; margin-left: 12px; }
  .nav-links a { color: var(--on-ocean-muted); text-decoration: none; font-size: 14.5px; font-weight: 500; }
  .nav-links a:hover { color: var(--on-ocean); }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .menu-btn { display: none; margin-left: auto; background: none; border: 1.5px solid rgba(234, 242, 244, 0.28); border-radius: 999px; padding: 7px 14px; color: var(--on-ocean); font-weight: 600; font-size: 14px; }
  .menu-panel { display: none; }
  @media (max-width: 859px) {
    .nav-links, .nav-actions { display: none; }
    .menu-btn { display: inline-flex; }
    .nav.open .menu-panel { display: grid; gap: 14px; padding-block: 8px 20px; }
    .menu-panel a { color: var(--on-ocean); text-decoration: none; font-weight: 500; font-size: 17px; }
    .menu-panel .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  }

  .hero { position: relative; background: var(--ocean); color: var(--on-ocean); overflow: hidden; }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(420px 320px at 78% 46%, rgba(79, 191, 159, 0.22), transparent 70%),
      radial-gradient(520px 380px at 8% 110%, rgba(121, 180, 238, 0.14), transparent 70%);
  }
  .hero-inner {
    position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 40px; align-items: center; padding-block: 72px 96px;
  }
  .hero .eyebrow { color: var(--mint); }
  .hero h1 { font-weight: 700; font-size: clamp(42px, 6.2vw, 78px); line-height: 1.02; letter-spacing: -0.035em; margin-top: 14px; }
  .hero h1 span { display: block; color: var(--apricot); }
  .hero-sub { margin-top: 22px; max-width: 34em; font-size: 18px; color: var(--on-ocean-muted); }
  .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
  .trust { display: flex; align-items: center; gap: 10px; margin-top: 22px; font-size: 14px; color: var(--on-ocean-muted); }
  .trust i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(79, 191, 159, 0.2); }
  @media (max-width: 899px) {
    .hero-inner { grid-template-columns: minmax(0, 1fr); padding-block: 48px 64px; gap: 28px; }
  }

  /* The toy */
  .stage { position: relative; display: grid; justify-items: center; gap: 18px; }
  .toy { position: relative; width: min(300px, 72vw); aspect-ratio: 5 / 6; user-select: none; -webkit-user-select: none; }
  .ear { position: absolute; top: 2%; width: 27%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFD1A6, #FF9F4A 55%, #E07A1F); }
  .ear.l { left: 7%; } .ear.r { right: 7%; }
  .ear::after { content: ""; position: absolute; inset: 26%; border-radius: 50%; background: rgba(120, 50, 0, 0.18); }
  .toy-body {
    position: absolute; inset: 10% 0 0 0;
    border-radius: 46% 46% 40% 40% / 40% 40% 34% 34%;
    background: radial-gradient(120% 90% at 30% 18%, #FFD1A6 0%, #FF9F4A 42%, #E8801F 100%);
    box-shadow: inset -16px -22px 34px rgba(120, 50, 0, 0.28), inset 10px 12px 26px rgba(255, 240, 220, 0.35), 0 44px 70px -24px rgba(0, 0, 0, 0.6);
  }
  .screen {
    position: absolute; left: 16%; right: 16%; top: 26%; aspect-ratio: 1.45;
    border-radius: 30% / 40%; background: var(--screen); color: var(--glow);
    box-shadow: inset 0 0 0 5px rgba(0, 0, 0, 0.28), 0 0 44px rgba(124, 240, 205, 0.25);
    display: grid; place-items: center;
  }
  .screen svg { width: 76%; filter: drop-shadow(0 0 6px rgba(124, 240, 205, 0.55)); }
  .screen .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  .press {
    position: absolute; left: 50%; bottom: 9%; width: 29%; aspect-ratio: 1; transform: translateX(-50%);
    border: 0; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #FFE9D2, #FFA85C 50%, #D96F14 100%);
    box-shadow: 0 9px 0 #B3560A, 0 16px 26px rgba(0, 0, 0, 0.35);
    touch-action: none; -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .press.down { transform: translateX(-50%) translateY(7px); box-shadow: 0 2px 0 #B3560A, 0 6px 12px rgba(0, 0, 0, 0.3); }
  .press:focus-visible { outline-offset: 6px; border-radius: 50%; }
  .bubble {
    position: relative; max-width: 360px; width: 100%;
    background: var(--on-ocean); color: #10212B; border-radius: 22px; padding: 14px 18px;
    font-size: 15.5px; line-height: 1.45; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.5); min-height: 52px;
  }
  .bubble::before { content: ""; position: absolute; top: -8px; left: 50%; width: 16px; height: 16px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
  .bubble .ask { display: block; font-size: 13px; font-weight: 600; color: #3E5460; margin-bottom: 4px; }
  .bubble .ans { display: block; }
  .waves { display: inline-flex; gap: 3px; align-items: center; height: 16px; margin-right: 8px; vertical-align: -2px; }
  .waves i { width: 3px; height: 100%; border-radius: 2px; background: var(--mint-ink); animation: wave 0.9s ease-in-out infinite; }
  .waves i:nth-child(2) { animation-delay: 0.15s; } .waves i:nth-child(3) { animation-delay: 0.3s; } .waves i:nth-child(4) { animation-delay: 0.45s; }
  @keyframes wave { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  .dots { display: inline-flex; gap: 5px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #3E5460; animation: dot 1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .band { padding-block: 96px; }
  .band.alt { background: var(--surface); border-block: 1px solid var(--line); }
  .band-head { display: grid; gap: 12px; max-width: 720px; margin-bottom: 48px; }
  .band-head h2 { font-size: clamp(30px, 3.8vw, 46px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 700; }
  .band-head p { font-size: 17.5px; color: var(--muted); max-width: 40em; }
  section[id] { scroll-margin-top: 80px; }
  @media (max-width: 639px) { .band { padding-block: 64px; } .band-head { margin-bottom: 32px; } }

  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .step { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 26px; display: grid; gap: 14px; align-content: start; }
  .step-top { display: flex; justify-content: space-between; align-items: center; }
  .step-n { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; color: var(--apricot-deep); letter-spacing: -0.04em; }
  .step h3 { font-size: 21px; letter-spacing: -0.015em; }
  .step p { color: var(--muted); }
  .chip-screen { width: 84px; height: 58px; border-radius: 16px; background: var(--screen); color: var(--glow); display: grid; place-items: center; }
  .chip-screen svg { width: 64px; }
  .chip-screen.dim { color: var(--glow-dim); }
  .mini-phone { width: 58px; height: 58px; border-radius: 16px; background: var(--mint-soft); color: var(--mint-ink); display: grid; place-items: center; }
  @media (max-width: 859px) { .steps { grid-template-columns: minmax(0, 1fr); } }

  .bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; }
  .tile { border-radius: 28px; padding: 28px; display: grid; gap: 12px; align-content: start; border: 1px solid var(--line); background: var(--ground); }
  .tile h3 { font-size: 22px; letter-spacing: -0.02em; }
  .tile p { color: var(--muted); }
  .tile.a { grid-column: span 4; background: var(--ocean); color: var(--on-ocean); border-color: transparent; }
  .tile.a p { color: var(--on-ocean-muted); }
  .tile.b { grid-column: span 2; }
  .tile.c { grid-column: span 3; }
  .tile.d { grid-column: span 3; }
  .say-lines { display: grid; gap: 10px; margin-top: 8px; }
  .say { justify-self: start; max-width: 100%; padding: 10px 16px; border-radius: 18px; font-size: 15px; }
  .say.child { background: rgba(234, 242, 244, 0.1); }
  .say.buddy { justify-self: end; background: var(--apricot); color: var(--apricot-ink); }
  .faces { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .faces .chip-screen { width: 64px; height: 46px; border-radius: 12px; }
  .faces .chip-screen svg { width: 48px; }
  .scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
  .scene { aspect-ratio: 1; border-radius: 14px; position: relative; overflow: hidden; }
  .scene svg { width: 100%; height: 100%; display: block; }
  .personas { display: flex; gap: 8px; flex-wrap: wrap; }
  .persona { padding: 7px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; font-size: 14px; }
  .soon { justify-self: start; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--apricot-soft); color: var(--apricot-deep); }
  @media (max-width: 899px) { .tile.a, .tile.b, .tile.c, .tile.d { grid-column: span 6; } }

  .safety { background: var(--ocean); color: var(--on-ocean); }
  .safety .band-head p { color: var(--on-ocean-muted); }
  .safety .eyebrow { color: var(--mint); }
  .promises { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .promise { border-radius: 22px; padding: 24px; background: var(--ocean-2); display: grid; gap: 10px; align-content: start; }
  .promise .ic { width: 42px; height: 42px; border-radius: 12px; background: rgba(79, 191, 159, 0.16); color: var(--glow); display: grid; place-items: center; }
  .promise h3 { font-size: 18px; letter-spacing: -0.01em; }
  .promise p { color: var(--on-ocean-muted); font-size: 15px; }
  @media (max-width: 899px) { .promises { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 599px) { .promises { grid-template-columns: minmax(0, 1fr); } }

  .free { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 18px 22px; border-radius: 22px; background: var(--mint-soft); color: var(--mint-ink); margin-bottom: 20px; font-weight: 500; }
  .free b { font-family: var(--display); font-size: 20px; }
  .price-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .price { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 26px; padding: 28px; display: grid; gap: 6px; align-content: start; }
  .price.best { border-color: var(--apricot); box-shadow: 0 20px 50px -24px rgba(217, 111, 20, 0.45); }
  .price h3 { font-size: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; background: var(--apricot); color: var(--apricot-ink); padding: 3px 10px; border-radius: 999px; }
  .price-amt { font-family: var(--display); font-weight: 700; font-size: 38px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 10px; }
  .price-credits { font-weight: 600; }
  .price-per { color: var(--muted); font-size: 14px; }
  .price .btn { margin-top: 18px; }
  .price-notes { display: flex; gap: 10px 28px; flex-wrap: wrap; margin-top: 22px; color: var(--muted); font-size: 14.5px; }
  .price-notes span { display: inline-flex; gap: 8px; align-items: center; }
  .price-notes svg { color: var(--mint); }
  @media (max-width: 859px) { .price-grid { grid-template-columns: minmax(0, 1fr); } }

  .faq { display: grid; gap: 12px; max-width: 820px; }
  .faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }
  .faq summary { cursor: pointer; font-weight: 600; font-size: 17px; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-family: var(--display); font-size: 22px; line-height: 1; color: var(--muted); }
  .faq details[open] summary::after { content: "\2212"; }
  .faq details p { margin-top: 10px; color: var(--muted); max-width: 62ch; }

  .closing { padding-block: 88px; }
  .closing-card { border-radius: 36px; background: var(--apricot); color: var(--apricot-ink); padding: clamp(28px, 5vw, 56px); display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .closing-card h2 { font-size: clamp(28px, 3.6vw, 44px); letter-spacing: -0.03em; max-width: 16ch; }
  .footer { padding-block: 28px 40px; color: var(--muted); font-size: 13.5px; display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); }

  /* ---------- App ---------- */
  .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
  .side {
    position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; align-self: start;
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 6px; padding: 22px 14px;
  }
  .side .wordmark { padding: 0 10px 18px; color: var(--ink); }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; border: 0; background: none;
    color: var(--muted); font-weight: 500; font-size: 15px; text-align: left; width: 100%;
  }
  .nav-item svg { width: 22px; height: 22px; flex: none; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--mint-soft); color: var(--mint-ink); font-weight: 600; }
  .side-foot { margin-top: auto; display: grid; gap: 10px; padding: 14px 10px 0; border-top: 1px solid var(--line); }

    const h = Math.floor(m / 60);

    const d = Math.floor(h / 24);

  function weekData() {
    const out = [];
    for (let i = 6; i >= 0; i -= 1) {
      const start = startOfDay(Date.now() - i * DAY);
      const n = D.ledger.filter((r) => r.kind === 'debit' && r.at >= start && r.at < start + DAY).reduce((s, r) => s + r.n, 0);
      out.push({ start, n, today: i === 0 });
    }
    return out;
  }

  // Seven daily bars, one hue, baseline-anchored, today labelled directly;
  // every bar also has a tooltip and the numbers are repeated in a table.
  function chartPanel() {
    const data = weekData();
    const total = data.reduce((s, d) => s + d.n, 0);
    const W = 560; const H = 214; const L = 30; const R = 8; const TOP = 26; const B = 30;
    const pw = W - L - R; const ph = H - TOP - B;
    const top = Math.max(4, Math.ceil(Math.max(...data.map((d) => d.n)) / 2) * 2);
    const y = (v) => TOP + ph - (v / top) * ph;
    const band = pw / 7;
    const bw = Math.min(38, band * 0.54);
    const short = new Intl.DateTimeFormat(locale(), { weekday: 'short' });
    const long = new Intl.DateTimeFormat(locale(), { weekday: 'long', day: 'numeric', month: 'numeric' });
    const grid = [0, top / 2, top].map((v) => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
    const bars = data.map((d, i) => {
      const x = L + i * band + (band - bw) / 2;
      const base = TOP + ph;
      const yt = y(d.n);
      const h = base - yt;
      const r = Math.min(4, h);
      const bar = h > 0 ? `<path class="bar" d="M${x} ${base} V${yt + r} Q${x} ${yt} ${x + r} ${yt} H${x + bw - r} Q${x + bw} ${yt} ${x + bw} ${yt + r} V${base} Z"/>` : '';
      const label = d.today ? `<text class="val" x="${x + bw / 2}" y="${yt - 7}" text-anchor="middle">${d.n}</text>` : '';
      const day = `<text class="axis ${d.today ? 'today' : ''}" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(short.format(d.start))}</text>`;
      const tip = t('tip', { d: long.format(d.start), n: d.n });
      const hit = `<rect class="hit" x="${L + i * band}" y="${TOP}" width="${band}" height="${ph}" tabindex="0" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}" data-y="${yt}" data-x="${x + bw / 2}"/>`;
      return bar + label + day + hit;
    }).join('');
    const table = `<table class="sr-only"><caption>${t('chartTable')}</caption><tbody>${data.map((d) => `<tr><th>${esc(long.format(d.start))}</th><td>${d.n}</td></tr>`).join('')}</tbody></table>`;
    return `<section class="panel span-7">
      <div class="panel-head"><h2>${t('chartTitle')}</h2><span class="total">${t('chartTotal', { n: total })}</span></div>
      <div class="chart-wrap" id="chart"><svg viewBox="0 0 ${W} ${H}" aria-hidden="false" role="group" aria-label="${t('chartTitle')}">${grid}${bars}</svg>${table}<div class="tip" id="tip" hidden></div></div>
    </section>`;
  }

  function toyCard(x) {
    const st = toyState(x);
    const action = x.status === 'active'
      ? `<button type="button" class="btn ghost sm" data-act="pause" data-id="${x.id}">${t('pause')}</button>`
      : x.by === 'parent' ? `<button type="button" class="btn apricot sm" data-act="wake" data-id="${x.id}">${t('wake')}</button>` : '';
    return `<article class="toy-card" data-act="open-toy" data-id="${x.id}" data-key="toy-${x.id}" role="button" tabindex="0" aria-label="${toyName(x)}">
      <div class="tc-screen ${st.dim ? 'dim' : ''}">${face(st.face)}</div>
      <div class="tc-body"><h3>${toyName(x)}</h3><div class="tc-meta">${st.pill}<span>${t('seen', { t: rel(x.seen) })}</span></div></div>
      ${action ? `<div class="tc-actions">${action}</div>` : ''}
    </article>`;
  }

  const addTile = () => `<button type="button" class="add-tile" data-act="start-add" data-key="add-tile"><span class="plus">${IC.plus}</span>${t('addToy')}</button>`;

  function onboardCard() {
    return `<section class="panel onboard span-12"><div class="chip-screen" style="width:120px;height:84px;border-radius:22px">${face('curious')}</div>
      <div><h2>${t('onboardT')}</h2><p>${t('onboardB')}</p><button type="button" class="btn apricot" data-act="start-add" data-key="onboard-add">${t('addToy')}</button></div></section>`;
  }

  function turnItem(u) {
    const c = child(u.child);
    const name = c ? esc(c.name) : '';
    if (u.status === 'completed') {
      return `<div class="feed-item"><div class="dot ok">${IC.check}</div>
        <div><div class="feed-title">${t('answered', { name })}</div><div class="feed-sub">${rel(u.at)}</div><p class="quote">“${esc(u.answer)}”</p></div>
        <div class="delta">-1</div></div>`;
    }
    const reason = u.status === 'abandoned' ? t('r_abandoned') : t(`r_${u.reason}`);
    const cls = u.reason === 'no_credits' ? 'warn' : 'rest';
    return `<div class="feed-item"><div class="dot ${cls}">${u.status === 'abandoned' ? IC.dash : IC.moon}</div>
      <div><div class="feed-title">${t('notAnswered', { name })}</div><div class="feed-sub">${reason} · ${rel(u.at)}</div></div>
      <div class="delta zero">${t('free')}</div></div>`;
  }

  const sortedTurns = () => [...D.turns].sort((a, b) => b.at - a.at);

  function screenOverview() {
    const recent = sortedTurns().slice(0, 3);
    const toys = D.toys.length
      ? `<section class="span-12"><div class="section-title"><h2>${t('yourToys')}</h2><button type="button" class="link" data-act="go" data-screen="toys">${t('manage')}</button></div>
          <div class="toy-grid">${D.toys.map(toyCard).join('')}${addTile()}</div></section>`
      : onboardCard();
    return `<div class="grid-12">
      ${balancePanel()}${chartPanel()}
      ${toys}
      <section class="panel span-12"><div class="panel-head"><h2>${t('recent')}</h2>${recent.length ? `<button type="button" class="link" data-act="go" data-screen="activity">${t('seeAll')}</button>` : ''}</div>
        <div class="feed">${recent.length ? recent.map(turnItem).join('') : `<div class="empty">${t('noTurns')}</div>`}</div></section>
    </div>
    <details class="tools"><summary>${t('tools')}</summary><div class="tools-body">
      <button type="button" class="btn ghost sm" data-act="sim-ask">${t('simAsk')}</button>
      <button type="button" class="btn ghost sm" data-act="sim-support">${t('simSupport')}</button>
      <button type="button" class="btn ghost sm" data-act="reset">${t('reset')}</button></div></details>`;
  }

  function screenToys() {
    if (!D.toys.length) return `<div class="grid-12">${onboardCard()}</div>`;
    return `<div class="toy-grid">${D.toys.map(toyCard).join('')}${addTile()}</div>`;
  }

  function screenCredits() {
    const packs = PACKS.map((p) => `<button type="button" class="pack ${p.id === 'big' ? 'best' : ''}" data-act="choose-pack" data-id="${p.id}" data-key="pack-${p.id}">
        <span class="pack-name">${t(`pack_${p.id}`)}${p.id === 'big' ? `<span class="badge">${t('best')}</span>` : ''}</span>
        <span class="pack-sub">${t('credits', { n: p.credits })} · ${t('perAnswer', { p: vnd(Math.round(p.price / p.credits)) })}</span>
        <span class="pack-price">${vnd(p.price)}</span></button>`).join('');
    const rows = D.ledger.map((r) => {
      let label;
      let delta;
      if (r.kind === 'debit') { label = t('l_debit', { n: r.n }); delta = -r.n; }
      else if (r.kind === 'purchase') { label = t('l_purchase', { pack: t(`pack_${r.pack}`) }); delta = r.delta; }
      else { label = t('l_welcome'); delta = r.delta; }
      return `<div class="feed-item"><div class="dot ${delta > 0 ? 'coin-dot' : 'rest'}">${delta > 0 ? IC.plus : IC.check}</div>
        <div><div class="feed-title">${label}</div><div class="feed-sub">${rel(r.at)}</div></div>
        <div class="delta ${delta > 0 ? 'pos' : ''}">${delta > 0 ? '+' : ''}${delta}</div></div>`;
    }).join('');
    return `<div class="grid-12">
      ${balancePanel()}
      <section class="panel span-7"><div class="panel-head"><h2>${t('packs')}</h2></div><div class="pack-list">${packs}</div></section>
      <section class="panel span-12"><div class="panel-head"><h2>${t('history')}</h2></div><div class="feed">${rows}</div></section>
    </div>`;
  }

  function screenActivity() {
    const list = sortedTurns().filter((u) => (S.filter === 'all' ? true : S.filter === 'answered' ? u.status === 'completed' : u.status !== 'completed'));
    const seg = [['all', 'fAll'], ['answered', 'fAnswered'], ['not', 'fNot']]
      .map(([v, k]) => `<button type="button" data-act="filter" data-v="${v}" aria-pressed="${S.filter === v}">${t(k)}</button>`).join('');
    return `<section class="panel">
      <div class="panel-head"><div class="seg" role="group">${seg}</div></div>
      <div class="feed">${list.length ? list.map(turnItem).join('') : `<div class="empty">${t('noTurns')}</div>`}</div>
      <p class="muted" style="font-size:14px;margin-top:12px">${t('activityNote')}</p></section>`;
  }

  function childForm(id) {
    const years = Array.from({ length: 11 }, (_, i) => YEAR - 1 - i).map((yv) => `<option value="${yv}" ${yv === 2020 ? 'selected' : ''}>${yv}</option>`).join('');
    return `<form class="form" id="${id}" novalidate style="margin-top:14px">
      <div class="field"><label for="${id}-name">${t('childName')}</label><input class="input" id="${id}-name" name="name" maxlength="40" autocomplete="off" data-autofocus></div>
      <div class="field"><label for="${id}-year">${t('birthYear')}</label><select class="input" id="${id}-year" name="year">${years}</select></div>
      <p class="msg bad" id="${id}-msg"></p>
      <button type="submit" class="btn apricot">${t('save')}</button></form>`;
  }

  function screenFamily() {
    const kids = D.children.map((c, i) => {
      const n = D.toys.filter((x) => x.child === c.id).length;
      return `<div class="row"><div class="kid"><span class="avatar ${i % 2 ? 'alt' : ''}">${esc(c.name.slice(0, 1))}</span>
        <div><div class="feed-title">${esc(c.name)}</div><div class="feed-sub">${t('age', { n: YEAR - c.year })}</div></div></div>
        <span class="feed-sub">${n ? t('buddies', { n }) : t('noBuddy')}</span></div>`;
    }).join('');
    return `<div class="grid-12">
      <section class="panel span-7"><div class="panel-head"><h2>${t('children')}</h2>${S.familyForm ? '' : `<button type="button" class="link" data-act="family-form">+ ${t('addChild')}</button>`}</div>
        ${D.children.length ? `<div class="rows">${kids}</div>` : `<p class="muted">${t('noKids')}</p>`}
        ${S.familyForm ? childForm('family-child') : ''}</section>
      <section class="panel span-5"><div class="panel-head"><h2>${t('account')}</h2></div>
        <div class="rows">
          <div class="row"><span class="k">${t('email')}</span><span class="v">${esc(D.parent.email)}</span></div>
          <div class="row"><span class="k">${t('familyName')}</span><span class="v">${esc(D.familyName)}</span></div>
          <div class="row"><span class="k">${t('language')}</span>${langSwitch()}</div>
        </div>
        <button type="button" class="btn ghost" data-act="sign-out" style="margin-top:14px">${IC.out}${t('signOut')}</button></section>
    </div>`;
  }

  function app() {
    const nav = SCREENS.map((s) => `<button type="button" class="nav-item" data-act="go" data-screen="${s}" ${S.screen === s ? 'aria-current="page"' : ''} aria-label="${screenTitle(s)}">${IC[s]}<span>${screenTitle(s)}</span></button>`).join('');
    const body = { overview: screenOverview, toys: screenToys, credits: screenCredits, activity: screenActivity, family: screenFamily }[S.screen]();
    const eyebrow = S.screen === 'overview' ? `${t('hi', { name: esc(D.parent.name) })} · ${esc(D.familyName)}` : esc(D.familyName);
    return `<div class="app">
      <aside class="side">
        ${wordmark('#')}
        ${nav}
        <div class="side-foot"><div class="who"><b>${esc(D.familyName)}</b><span class="muted">${esc(D.parent.email)}</span></div>
          <button type="button" class="nav-item" data-act="sign-out" aria-label="${t('signOut')}">${IC.out}<span>${t('signOut')}</span></button></div>
      </aside>
      <main class="main">
        <div class="appbar">${wordmark('#')}${langSwitch()}</div>
        <header class="page-head"><div><p class="eyebrow">${eyebrow}</p><h1>${screenTitle(S.screen)}</h1></div>
          <div class="head-actions">${langSwitch()}<button type="button" class="btn apricot" data-act="start-add" data-key="head-add">${IC.plus}${t('addToy')}</button></div></header>
        ${body}
      </main>
    </div>`;
  }

  // ---------- Layers ----------

  const closeBtn = () => `<button type="button" class="x" data-act="close-layer" aria-label="${t('close')}">${IC.x}</button>`;

  function layerAuth(L) {
    const reg = L.mode === 'register';
    return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <div class="layer-head"><h2 id="auth-title">${reg ? t('createTitle') : t('welcomeBack')}</h2>${closeBtn()}</div>
      <div class="auth-tabs" role="group"><button type="button" data-act="auth-mode" data-v="login" aria-pressed="${!reg}">${t('signIn')}</button><button type="button" data-act="auth-mode" data-v="register" aria-pressed="${reg}">${t('register')}</button></div>
      <form class="form" id="auth-form" novalidate>
        ${reg ? `<div class="field"><label for="auth-family">${t('familyName')}</label><input class="input" id="auth-family" name="family" autocomplete="off" data-autofocus></div>` : ''}
        <div class="field"><label for="auth-email">${t('email')}</label><input class="input" id="auth-email" name="email" type="email" autocomplete="email" value="${reg ? '' : 'lan.nguyen@example.com'}" ${reg ? '' : 'data-autofocus'}></div>
        <div class="field"><label for="auth-password">${t('password')}</label><input class="input" id="auth-password" name="password" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" value="${reg ? '' : 'bong-2020!'}"><span class="muted" style="font-size:13.5px">${t('pwHint')}</span></div>
        <p class="msg bad">${L.error ? esc(L.error) : ''}</p>
        <button type="submit" class="btn apricot lg block">${reg ? t('register') : t('signIn')}</button>
        ${reg ? `<p class="muted" style="text-align:center;font-size:14px">${t('registerNote')}</p>` : ''}
      </form></div>`;
  }

  const codeReady = (raw) => raw.length === 8 && [...raw].every((c) => ALPHABET.includes(c));

  function layerAdd(L) {
    const order = ['code', 'child', 'done'];
    const stepper = `<div class="stepper" aria-hidden="true">${order.map((s, i) => `<span class="${order.indexOf(L.step) >= i ? 'on' : ''}"></span>`).join('')}</div>`;
    const head = `<div class="layer-head"><h2 id="add-title">${t('addTitle')}</h2>${closeBtn()}</div>${stepper}`;
    let body;
    if (L.step === 'code') {
      const formatted = L.code.length > 4 ? `${L.code.slice(0, 4)}-${L.code.slice(4)}` : L.code;
      body = `<form class="form" id="code-form" novalidate>
        <h3 style="font-size:19px">${t('codeTitle')}</h3>
        <input class="input code-input" id="claim-code" value="${esc(formatted)}" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-msg" data-autofocus>
        <p class="msg ${L.error ? 'bad' : 'muted'}" id="code-msg">${L.error ? esc(L.error) : t('codeHelp')}</p>
        <button type="submit" class="btn apricot lg block" id="code-next" ${codeReady(L.code) && !L.checking ? '' : 'disabled'}>${L.checking ? t('checking') : t('next')}</button>
        <p class="muted" style="font-size:13.5px">${t('codeDemo')}</p></form>`;
    } else if (L.step === 'child') {
      const choices = D.children.map((c, i) => `<button type="button" class="choice" data-act="pick-child" data-id="${c.id}" aria-pressed="${L.child === c.id}">
          <span class="avatar ${i % 2 ? 'alt' : ''}">${esc(c.name.slice(0, 1))}</span><span><b>${esc(c.name)}</b><br><span class="feed-sub">${t('age', { n: YEAR - c.year })}</span></span></button>`).join('');
      body = `<div class="form"><div class="hero-screen">${face('curious')}</div>
        <div><h3 style="font-size:19px">${t('childTitle')}</h3><p class="muted" style="font-size:14.5px">${t('childHelp')}</p></div>
        <div class="choices">${choices}</div>
        ${L.childForm ? childForm('add-child') : `<button type="button" class="link" data-act="add-child-form" style="justify-self:start">+ ${t('addChildInline')}</button>`}
        <button type="button" class="btn apricot lg block" data-act="finish-add" ${L.child ? '' : 'disabled'}>${t('next')}</button>
        <button type="button" class="btn ghost block" data-act="finish-add" data-skip="1">${t('later')}</button></div>`;
    } else {
      const x = toy(L.toyId);
      body = `<div class="center"><div class="hero-screen" style="width:100%">${face('happy')}</div><h2>${t('readyT')}</h2><p class="muted">${t('readyB')}</p><p class="mono muted">${esc(x.serial)}</p>
        <button type="button" class="btn apricot lg block" data-act="add-done" data-autofocus>${t('goToys')}</button></div>`;
    }
    return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title">${head}${body}</div>`;
  }

  function layerToy(L) {
    const x = toy(L.id);
    if (!x) return '';
    const st = toyState(x);
    const options = [`<option value="">${t('noChild')}</option>`, ...D.children.map((c) => `<option value="${c.id}" ${x.child === c.id ? 'selected' : ''}>${esc(c.name)}</option>`)].join('');
    let action;
    if (x.status === 'active') action = `<button type="button" class="btn ghost block" data-act="pause" data-id="${x.id}">${t('pause')}</button><p class="muted" style="font-size:14px">${t('pauseExplain')}</p>`;
    else if (x.by === 'parent') action = `<button type="button" class="btn apricot block" data-act="wake" data-id="${x.id}">${t('wake')}</button><p class="muted" style="font-size:14px">${t('pauseExplain')}</p>`;
    else action = `<div class="banner bad">${IC.alert}<span>${t('supportExplain')}</span></div>`;
    const remove = L.confirmRemove
      ? `<div class="confirm"><p>${t('removeAsk')}</p><div class="actions"><button type="button" class="btn danger-solid" data-act="remove" data-id="${x.id}" data-autofocus>${t('removeYes')}</button><button type="button" class="btn ghost" data-act="cancel-remove">${t('cancel')}</button></div></div>`
      : `<button type="button" class="btn danger" data-act="ask-remove" style="justify-self:start">${t('remove')}</button>`;
    return `<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="toy-title">
      <div class="layer-head"><h2 id="toy-title">${toyName(x)}</h2>${closeBtn()}</div>
      <div class="hero-screen ${st.dim ? 'dim' : ''}">${face(st.face)}</div>
      <div>${st.pill}</div>
      <div class="form" style="gap:10px">${action}</div>
      <div class="rows">
        <div class="row"><label class="k" for="toy-child">${t('toyFor')}</label><select class="input" id="toy-child" data-id="${x.id}" style="width:auto">${options}</select></div>
        <div class="row"><span class="k">${t('lastSeen')}</span><span class="v">${rel(x.seen)}</span></div>
        <div class="row"><span class="k">${t('serial')}</span><span class="v mono">${esc(x.serial)}</span></div>
        <div class="row"><span class="k">${t('firmware')}</span><span class="v mono">${esc(x.fw)}</span></div>
      </div>
      ${remove}
    </aside>`;
  }

  function layerPay(L) {
    const p = PACKS.find((x) => x.id === L.pack);
    const head = `<div class="layer-head"><h2 id="pay-title">${t('payTitle')}</h2>${L.phase === 'processing' ? '' : closeBtn()}</div>`;
    let body;
    if (L.phase === 'processing') body = `<div class="center" style="padding-block:28px"><div class="spinner" role="progressbar" aria-label="${t('paying')}"></div><p>${t('paying')}</p></div>`;
    else if (L.phase === 'paid') body = `<div class="center"><div class="hero-screen" style="width:100%">${face('happy')}</div><h2>${t('paidT', { n: p.credits })}</h2><p class="muted">${t('paidB', { b: balance() })}</p><button type="button" class="btn apricot lg block" data-act="close-layer" data-autofocus>${t('done')}</button></div>`;
    else if (L.phase === 'declined') body = `<div class="form"><div class="banner bad">${IC.alert}<span><b>${t('declinedT')}</b><br>${t('declinedB')}</span></div><button type="button" class="btn apricot lg block" data-act="pay-retry" data-autofocus>${t('tryAgain')}</button><button type="button" class="btn ghost block" data-act="close-layer">${t('cancel')}</button></div>`;
    else {
      body = `<div class="form">
        <div class="summary"><span class="muted">${t('pack')}</span><b>${t(`pack_${p.id}`)}</b><span class="muted">${t('add')}</span><b>+${t('credits', { n: p.credits })}</b><span class="muted">${t('total')}</span><span class="big">${vnd(p.price)}</span></div>
        <div class="banner mint">${IC.alert}<span>${t('payNote')}</span></div>
        <label class="check" for="decline"><input type="checkbox" id="decline" ${L.decline ? 'checked' : ''}> ${t('payDecline')}</label>
        <button type="button" class="btn apricot lg block" data-act="pay" data-autofocus>${t('pay', { price: vnd(p.price) })}</button></div>`;
    }
    return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pay-title">${head}${body}</div>`;
  }

  function layer() {
    const L = S.layer;
    if (!L) return '';
    const inner = { auth: layerAuth, add: layerAdd, toy: layerToy, pay: layerPay }[L.type](L);
    return `<div class="scrim ${L.type === 'toy' ? 'drawer-mode' : ''}" data-act="scrim">${inner}</div>`;
  }

  // ---------- Render ----------

  function renderPage() {
    document.documentElement.lang = lang;
    document.getElementById('page').innerHTML = S.view === 'marketing' ? marketing() : app();
    if (S.view === 'marketing') setupToy();
    else setupChart();
  }

  function renderLayer() {
    const host = document.getElementById('layer');
    host.innerHTML = layer();
    document.body.style.overflow = S.layer ? 'hidden' : '';
    if (S.layer && !host.contains(document.activeElement)) {
      const target = host.querySelector('[data-autofocus]') || host.querySelector('button, input, select');
      target?.focus();
    }
  }

  function render() {
    renderPage();
    renderLayer();
  }

  function openLayer(L, opener) {
    S.layer = L;
    S.openerKey = opener?.dataset.key ?? null;
    renderLayer();
  }

  function closeLayer() {
    if (S.layer?.type === 'pay' && S.layer.phase === 'processing') return;
    const key = S.openerKey;
    S.layer = null;
    S.openerKey = null;
    render();
    if (key) document.querySelector(`[data-key="${key}"]`)?.focus();
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  function go(screen) {
    S.screen = screen;
    S.familyForm = false;
    render();
    window.scrollTo(0, 0);
  }

  // The hero toy: hold to talk, like the real one. A press that is too short
  // is treated as an accident, exactly as the button on the toy.
  let toyTimers = [];
  function setupToy() {
    const btn = document.getElementById('press');
    const screen = document.getElementById('hero-screen');
    const bubble = document.getElementById('bubble');
    if (!btn) return;
    let downAt = 0;
    let active = false;
    const setFace = (st) => { screen.innerHTML = face(st); };
    const clear = () => { toyTimers.forEach(clearTimeout); toyTimers = []; };
    clear();
    const startHold = () => {
      if (active) return;
      active = true;
      clear();
      downAt = Date.now();
      btn.classList.add('down');
      setFace('listen');
      bubble.innerHTML = `<span class="waves" aria-hidden="true"><i></i><i></i><i></i><i></i></span>${t('listening')}`;
    };
    const endHold = () => {
      if (!active) return;
      active = false;
      btn.classList.remove('down');
      if (Date.now() - downAt < 650) {
        setFace('rest');
        bubble.textContent = t('holdLonger');
        return;
      }
      const list = QA[lang];
      const qa = list[S.qi % list.length];
      S.qi += 1;
      setFace('think');
      bubble.innerHTML = `<span class="ask">${t('asked')}: “${esc(qa.q)}”</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>`;
      toyTimers.push(setTimeout(() => {
        setFace('happy');
        bubble.innerHTML = `<span class="ask">${t('asked')}: “${esc(qa.q)}”</span><span class="ans">${esc(qa.a)}</span>`;
        toyTimers.push(setTimeout(() => setFace('rest'), 7000));
      }, 1100));
    };
    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture?.(e.pointerId); btn.focus({ preventScroll: true }); startHold(); });
    btn.addEventListener('pointerup', endHold);
    btn.addEventListener('pointercancel', endHold);
    btn.addEventListener('lostpointercapture', endHold);
    btn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); startHold(); } });
    btn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); endHold(); } });
    btn.addEventListener('blur', endHold);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function setupChart() {
    const wrap = document.getElementById('chart');
    if (!wrap) return;
    const tip = document.getElementById('tip');
    const svg = wrap.querySelector('svg');
    const show = (el) => {
      const vb = svg.viewBox.baseVal;
      const sr = svg.getBoundingClientRect();
      const wr = wrap.getBoundingClientRect();
      const k = sr.width / vb.width;
      tip.textContent = el.dataset.tip;
      tip.style.left = `${sr.left - wr.left + Number(el.dataset.x) * k}px`;
      tip.style.top = `${sr.top - wr.top + Number(el.dataset.y) * k}px`;
      tip.hidden = false;
    };
    const hide = () => { tip.hidden = true; };
    wrap.querySelectorAll('.hit').forEach((el) => {
      el.addEventListener('mouseenter', () => show(el));
      el.addEventListener('focus', () => show(el));
      el.addEventListener('mouseleave', hide);
      el.addEventListener('blur', hide);
    });
  }

  // ---------- Simulation (same rules as the backend's ask gate) ----------

  function addDebit() {
    const today = startOfDay(Date.now());
    const row = D.ledger.find((r) => r.kind === 'debit' && r.at >= today);
    if (row) { row.n += 1; row.at = Date.now(); }
    else D.ledger.unshift({ id: uid('d'), kind: 'debit', n: 1, at: Date.now() });
    D.ledger.sort((a, b) => b.at - a.at);
  }

  function simulateAsk() {
    const x = D.toys.find((y) => y.status === 'active') ?? D.toys[0];
    if (!x) { toast(t('noActive')); return; }
    x.seen = Date.now();
    let reason = null;
    if (x.status !== 'active') reason = 'disabled';
    else if (balance() < 1) reason = 'no_credits';
    if (reason) {
      D.turns.push({ id: uid('u'), toy: x.id, child: x.child, status: 'denied', reason, at: Date.now() });
      toast(t('simDenied', { r: t(`r_${reason}`) }));
    } else {
      D.turns.push({ id: uid('u'), toy: x.id, child: x.child, status: 'completed', answer: ANSWERS[seq % ANSWERS.length], at: Date.now() });
      addDebit();
      toast(t('simAnswered'));
    }
    render();
  }

  // ---------- Events ----------

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const id = el.dataset.id;
    switch (act) {
      case 'scrim': if (e.target === el) closeLayer(); break;
      case 'close-layer': closeLayer(); break;
      case 'lang':
        lang = el.dataset.v;
        try { localStorage.setItem('lb2-lang', lang); } catch { /* optional */ }
        render();
        break;
      case 'menu': {
        const nav = document.getElementById('nav');
        const open = nav.classList.toggle('open');
        el.setAttribute('aria-expanded', String(open));
        break;
      }
      case 'menu-link': document.getElementById('nav')?.classList.remove('open'); break;
      case 'open-auth': openLayer({ type: 'auth', mode: el.dataset.mode, error: null }, el); break;
      case 'auth-mode': S.layer.mode = el.dataset.v; S.layer.error = null; renderLayer(); break;
      case 'go': S.layer = null; go(el.dataset.screen); break;
      case 'open-toy': openLayer({ type: 'toy', id, confirmRemove: false }, el); break;
      case 'pause': {
        const x = toy(id); x.status = 'disabled'; x.by = 'parent';
        render(); toast(t('pausedToast')); break;
      }
      case 'wake': {
        const x = toy(id); x.status = 'active'; x.by = null; x.seen = Date.now();
        render(); toast(t('wokeToast')); break;
      }
      case 'ask-remove': S.layer.confirmRemove = true; renderLayer(); break;
      case 'cancel-remove': S.layer.confirmRemove = false; renderLayer(); break;
      case 'remove':
        D.toys = D.toys.filter((x) => x.id !== id);
        S.layer = null;
        S.openerKey = null;
        render();
        toast(t('removed'));
        break;
      case 'start-add': openLayer({ type: 'add', step: 'code', code: '', error: null, checking: false, child: null, toyId: null, childForm: false }, el); break;
      case 'pick-child': S.layer.child = id; renderLayer(); break;
      case 'add-child-form': S.layer.childForm = true; renderLayer(); document.getElementById('add-child-name')?.focus(); break;
      case 'finish-add':
        toy(S.layer.toyId).child = el.dataset.skip ? null : S.layer.child;
        S.layer.step = 'done';
        S.layer.childForm = false;
        render();
        break;
      case 'add-done': S.layer = null; S.openerKey = null; go('toys'); break;
      case 'choose-pack':
        if (S.view === 'marketing') openLayer({ type: 'auth', mode: 'register', error: null }, el);
        else openLayer({ type: 'pay', pack: id, decline: false, phase: 'confirm' }, el);
        break;
      case 'pay': {
        const L = S.layer;
        L.decline = document.getElementById('decline').checked;
        L.phase = 'processing';
        renderLayer();
        setTimeout(() => {
          if (L.decline) L.phase = 'declined';
          else {
            const p = PACKS.find((x) => x.id === L.pack);
            D.ledger.unshift({ id: uid('p'), kind: 'purchase', pack: p.id, delta: p.credits, at: Date.now() });
            L.phase = 'paid';
          }
          render();
        }, 1300);
        break;
      }
      case 'pay-retry': S.layer.phase = 'confirm'; renderLayer(); break;
      case 'filter': S.filter = el.dataset.v; render(); break;
      case 'family-form': S.familyForm = true; render(); document.getElementById('family-child-name')?.focus(); break;
      case 'sign-out': S.view = 'marketing'; S.layer = null; render(); window.scrollTo(0, 0); break;
      case 'sim-ask': simulateAsk(); break;
      case 'sim-support': {
        const x = D.toys.find((y) => y.status === 'active');
        if (x) { x.status = 'disabled'; x.by = 'admin'; render(); }
        break;
      }
      case 'reset': D = example(); go('overview'); break;
      default: break;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && S.layer) { closeLayer(); return; }
    const card = e.target.closest?.('.toy-card');
    if (card && e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id !== 'claim-code') return;
    const el = e.target;
    const raw = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    el.value = raw.length > 4 ? `${raw.slice(0, 4)}-${raw.slice(4)}` : raw;
    S.layer.code = raw;
    S.layer.error = null;
    const bad = [...raw].find((c) => !ALPHABET.includes(c));
    const msg = document.getElementById('code-msg');
    msg.className = `msg ${bad ? 'bad' : 'muted'}`;
    msg.textContent = bad ? t('codeBad', { c: bad }) : t('codeHelp');
    document.getElementById('code-next').disabled = !codeReady(raw);
  });

  document.addEventListener('change', (e) => {
    if (e.target.id !== 'toy-child') return;
    toy(e.target.dataset.id).child = e.target.value || null;
    render();
    toast(t('saved'));
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'code-form') {
      const L = S.layer;
      if (!codeReady(L.code)) return;
      L.checking = true;
      renderLayer();
      setTimeout(() => {
        L.checking = false;
        // ABCD-EFGH plays the part of a code that matches no toy.
        if (L.code === 'ABCDEFGH') { L.error = t('codeInvalid'); renderLayer(); document.getElementById('claim-code')?.focus(); return; }
        const x = { id: uid('t'), serial: `2026W38A-${String(40 + seq).padStart(4, '0')}`, status: 'active', by: null, child: null, seen: Date.now(), fw: '1.0.3' };
        D.toys.push(x);
        L.toyId = x.id;
        L.step = 'child';
        L.child = D.children[0]?.id ?? null;
        render();
      }, 700);
      return;
    }
    if (f.id === 'add-child' || f.id === 'family-child') {
      const name = f.elements.name.value.trim();
      if (!name) { document.getElementById(`${f.id}-msg`).textContent = t('needName'); return; }
      const c = { id: uid('c'), name, year: Number(f.elements.year.value) };
      D.children.push(c);
      if (f.id === 'add-child') { S.layer.child = c.id; S.layer.childForm = false; }
      else S.familyForm = false;
      render();
      toast(t('saved'));
      return;
    }
    if (f.id === 'auth-form') {
      const L = S.layer;
      const reg = L.mode === 'register';
      const email = f.elements.email.value.trim();
      const password = f.elements.password.value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { L.error = t(reg ? 'badEmail' : 'badLogin'); renderLayer(); return; }
      if (password.length < 8) { L.error = t(reg ? 'shortPw' : 'badLogin'); renderLayer(); return; }
      if (reg) {
        const familyName = f.elements.family.value.trim();
        if (!familyName) { L.error = t('needFamily'); renderLayer(); return; }
        // A brand new family: 10 welcome credits and nothing else yet.
        D = { parent: { name: email.split('@')[0], email }, familyName, children: [], toys: [], ledger: [{ id: uid('w'), kind: 'welcome', delta: 10, at: Date.now() }], turns: [] };
      } else if (!D.toys.length && D.parent.email !== email) {
        D = example();
      }
      S.layer = null;
      S.openerKey = null;
      S.view = 'app';
      S.screen = 'overview';
      render();
      window.scrollTo(0, 0);
    }
  });

  render();
})();
</script>
</body>
</html>
